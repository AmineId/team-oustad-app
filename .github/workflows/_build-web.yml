name: 🌐 Web Build — kiosk / showcase (reusable)

on:
  workflow_call:
    inputs:
      dart-env:
        required: true
        type: string   # pprod | prod
      web-target:
        required: false
        type: string   # kiosk | showcase
        default: 'kiosk'
      api-url:
        required: false
        type: string
        default: ''
      android-testing-url:
        required: false
        type: string
        default: ''
      ipa-url:
        required: false
        type: string
        default: ''
      altstore-source-url:
        required: false
        type: string
        default: ''
      ref:
        required: false
        type: string
        default: ''
    outputs:
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}

  # Permet de lancer ce build web seul, sans passer par Release & Deploy
  workflow_dispatch:
    inputs:
      dart-env:
        description: 'Environnement API / Firebase'
        required: true
        type: choice
        default: 'pprod'
        options: [pprod, prod]
      web-target:
        description: 'Cible web'
        required: true
        type: choice
        default: 'kiosk'
        options: [kiosk, showcase]
      api-url:
        description: 'Override API_BASE_URL (optionnel)'
        required: false
        type: string
        default: ''
      android-testing-url:
        description: 'Lien Play Store internal testing (optionnel)'
        required: false
        type: string
        default: ''
      ipa-url:
        description: 'URL de téléchargement IPA (optionnel)'
        required: false
        type: string
        default: ''
      altstore-source-url:
        description: 'URL de la source AltStore (optionnel)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Branche/ref à builder (vide = branche courante)'
        required: false
        type: string
        default: ''

env:
  FLUTTER_VERSION: '3.35.7'

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact-name }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🏗️ Build Flutter Web
        id: meta
        run: |
          DEFINES="--dart-define=ENVIRONMENT=${{ inputs.dart-env }} --dart-define=WEB_TARGET=${{ inputs.web-target }}"
          if [ -n "${{ inputs.api-url }}" ]; then
            DEFINES="$DEFINES --dart-define=API_BASE_URL=${{ inputs.api-url }}"
          fi
          if [ -n "${{ inputs.android-testing-url }}" ]; then
            DEFINES="$DEFINES --dart-define=ANDROID_TESTING_URL=${{ inputs.android-testing-url }}"
          fi
          if [ -n "${{ inputs.ipa-url }}" ]; then
            DEFINES="$DEFINES --dart-define=KIOSK_IPA_URL=${{ inputs.ipa-url }}"
          fi
          if [ -n "${{ inputs.altstore-source-url }}" ]; then
            DEFINES="$DEFINES --dart-define=KIOSK_ALTSTORE_SOURCE_URL=${{ inputs.altstore-source-url }}"
          fi
          flutter build web --release $DEFINES --no-source-maps
          echo "artifact-name=${{ inputs.web-target }}-web-${{ inputs.dart-env }}" >> $GITHUB_OUTPUT

      - name: 📤 Upload web artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.artifact-name }}
          path: build/web
          retention-days: 1

      - name: 📋 Résumé
        if: always()
        continue-on-error: true
        env:
          TARGET: ${{ inputs.web-target }}
          DART_ENV: ${{ inputs.dart-env }}
          API_URL: ${{ inputs.api-url }}
          BUILD: ${{ steps.meta.outcome }}
          ARTIFACT: ${{ steps.meta.outputs.artifact-name }}
        run: |
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "⏹️";; *) echo "⏭️";; esac; }
          {
            echo "### 🌐 Web $TARGET ($DART_ENV) $(icon "$BUILD")"
            echo
            echo "- API : \`${API_URL:-par défaut ($DART_ENV)}\`"
            [ -d build/web ] && echo "- Taille : $(du -sh build/web | cut -f1), \`main.dart.js\` $(du -h build/web/main.dart.js 2>/dev/null | cut -f1)"
            [ -n "$ARTIFACT" ] && echo "- Artefact : \`$ARTIFACT\`"
          } >> "$GITHUB_STEP_SUMMARY"
