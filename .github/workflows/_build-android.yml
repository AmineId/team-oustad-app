name: 🤖 Android Build (reusable)

on:
  workflow_call:
    inputs:
      dart-env:
        required: true
        type: string   # pprod | prod
      api-url:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ''
      deploy-to-play:
        required: false
        type: boolean
        default: false
      publish-version:
        required: false
        type: boolean
        default: false
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      SERVICE_ACCOUNT_JSON:
        required: false
      OTA_BEARER_TOKEN:
        required: false

  # Permet de lancer ce build Android seul, sans passer par Release & Deploy.
  # deploy-to-play / publish-version à false par défaut : un run manuel ne
  # garantit pas que version-metadata.json correspond à ce build.
  workflow_dispatch:
    inputs:
      dart-env:
        description: 'Environnement API / Firebase'
        required: true
        type: choice
        default: 'pprod'
        options: [pprod, prod]
      api-url:
        description: 'URL de l API backend'
        required: true
        type: string
        default: 'https://api-pprod.team-oustad.com'
      ref:
        description: 'Branche/ref à builder (vide = branche courante)'
        required: false
        type: string
        default: ''
      deploy-to-play:
        description: 'Déployer sur Play Store (internal testing)'
        required: false
        type: boolean
        default: false
      publish-version:
        description: 'Publier version-metadata.json sur le serveur'
        required: false
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.35.7'
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN || github.token }}

      - name: ☕ Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 🔧 Patch Flutter Gradle plugin (multi-module dedup)
        run: scripts/ci/patch-flutter-gradle.sh

      - name: 🔧 Configure Firebase
        run: |
          if [ "${{ inputs.dart-env }}" = "prod" ]; then
            cp android/app/google-services-prod.json android/app/google-services.json
          else
            cp android/app/google-services-pprod.json android/app/google-services.json
          fi

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔐 Setup Android signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
            echo "✅ Signing configuré"
          else
            echo "⚠️  Pas de keystore, debug signing"
          fi

      - name: 🏗️ Build AAB (téléphone + Wear OS)
        id: build_aab
        env:
          GRADLE_OPTS: "-Dorg.gradle.logging.stacktrace=all"
        run: |
          flutter build appbundle --release \
            --dart-define=ENVIRONMENT=${{ inputs.dart-env }} \
            --dart-define=API_BASE_URL=${{ inputs.api-url }}

      # Play refuse sur la piste mobile tout bundle qui exige la fonction montre
      # (le plugin Dart `wear` l'injecte) : vérifié ici, avant tout envoi.
      - name: 🔍 Vérifier les manifestes (téléphone ≠ montre)
        run: |
          PHONE=build/app/outputs/bundle/release/app-release.aab
          WEAR=build/wear_app/outputs/bundle/release/wear_app-release.aab
          if unzip -p "$PHONE" base/manifest/AndroidManifest.xml | grep -a -q 'android.hardware.type.watch'; then
            echo "❌ L'AAB téléphone exige android.hardware.type.watch (voir android/app/src/main/AndroidManifest.xml)"; exit 1
          fi
          if ! unzip -p "$WEAR" base/manifest/AndroidManifest.xml | grep -a -q 'android.hardware.type.watch'; then
            echo "❌ L'AAB Wear OS ne déclare pas android.hardware.type.watch"; exit 1
          fi
          echo "✅ Téléphone sans fonction montre, Wear OS avec"

      - name: 🔧 Setup Ruby + Fastlane
        if: inputs.deploy-to-play
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: 📦 Install Fastlane
        if: inputs.deploy-to-play
        run: cd android && bundle install

      - name: 🔐 Setup Play Store credentials
        if: inputs.deploy-to-play
        run: |
          mkdir -p android/fastlane
          cat > android/fastlane/service-account-key.json << 'EOFJSON'
          ${{ secrets.SERVICE_ACCOUNT_JSON }}
          EOFJSON
          jq empty android/fastlane/service-account-key.json || exit 1

      # Notes Play (fr-FR, ≤ 500 car.) = variable de dépôt PLAY_RELEASE_NOTES, ou
      # texte par défaut ; rien n'est tiré des commits (liste dans le résumé du run).
      - name: 📝 Generate release notes
        if: inputs.deploy-to-play
        continue-on-error: true
        env:
          PLAY_RELEASE_NOTES: ${{ vars.PLAY_RELEASE_NOTES }}
        run: |
          scripts/release-notes.sh \
            android/fastlane/metadata/android/fr-FR/changelogs/default.txt \
            "$GITHUB_STEP_SUMMARY"

      - name: 📤 Deploy to Play Store (internal testing)
        id: deploy_play
        if: inputs.deploy-to-play
        env:
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
        run: |
          AAB="$(pwd)/build/app/outputs/bundle/release/app-release.aab"
          [ -f "$AAB" ] || { echo "❌ AAB introuvable"; exit 1; }
          cd android && ../scripts/play-upload.sh "$AAB" internal

      # L'app montre a son propre canal Wear OS (facteur de forme ajouté dans la
      # Play Console) : même package, versionCode du téléphone + 1 000 000.
      - name: ⌚ Deploy Wear OS (internal testing)
        id: deploy_wear
        if: inputs.deploy-to-play
        env:
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
        run: |
          AAB="$(pwd)/build/wear_app/outputs/bundle/release/wear_app-release.aab"
          [ -f "$AAB" ] || { echo "❌ AAB Wear OS introuvable"; exit 1; }
          cd android && ../scripts/play-upload.sh "$AAB" wear:internal

      - name: 📤 Publish version to server
        id: publish_version
        if: inputs.publish-version
        run: |
          JSON_PAYLOAD=$(jq -n \
            --slurpfile meta version-metadata.json \
            --arg url "https://play.google.com/store/apps/details?id=team.oustad.app" \
            '$meta[0] | {version_code, version_name, changelog, force_update,
              min_supported_version, download_url: $url, channel: "production"}')
          echo "$JSON_PAYLOAD" | jq '.'
          RESPONSE=$(curl -s -w "\n%{http_code}" --connect-timeout 10 --max-time 30 \
            -X POST "${{ inputs.api-url }}/android/update-version" \
            -H "Authorization: Bearer ${{ secrets.OTA_BEARER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Publication échouée: HTTP $HTTP_CODE"; exit 1
          fi
          echo "✅ Version publiée"

      - name: 📋 Résumé
        if: always()
        continue-on-error: true
        env:
          DART_ENV: ${{ inputs.dart-env }}
          API_URL: ${{ inputs.api-url }}
          BUILD: ${{ steps.build_aab.outcome }}
          DEPLOY: ${{ steps.deploy_play.outcome }}
          DEPLOY_WEAR: ${{ steps.deploy_wear.outcome }}
          DEPLOY_STATUS: ${{ steps.deploy_play.outputs.status }}
          DEPLOY_WEAR_STATUS: ${{ steps.deploy_wear.outputs.status }}
          PUBLISH: ${{ steps.publish_version.outcome }}
        run: |
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "⏹️";; *) echo "⏭️";; esac; }
          size() { [ -f "$1" ] && du -h "$1" | cut -f1 || echo "—"; }
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          SIGNING=$([ -f android/key.properties ] && echo "clé release" || echo "⚠️ debug")
          PHONE=build/app/outputs/bundle/release/app-release.aab
          WEAR=build/wear_app/outputs/bundle/release/wear_app-release.aab
          {
            echo "### 🤖 Android — \`$VERSION\` ($DART_ENV)"
            echo
            echo "| Étape | Résultat | Détail |"
            echo "| --- | --- | --- |"
            echo "| Build AAB | $(icon "$BUILD") | signature : $SIGNING |"
            echo "| AAB téléphone | $([ -f "$PHONE" ] && echo ✅ || echo —) | $(size "$PHONE") |"
            echo "| AAB Wear OS | $([ -f "$WEAR" ] && echo ✅ || echo —) | $(size "$WEAR") |"
            echo "| Play Store téléphone (internal) | $(icon "$DEPLOY") | ${DEPLOY_STATUS:-—} |"
            echo "| Play Store Wear OS (wear:internal) | $(icon "$DEPLOY_WEAR") | ${DEPLOY_WEAR_STATUS:-—} |"
            echo "| Version serveur | $(icon "$PUBLISH") | \`$API_URL/android/update-version\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🧹 Cleanup
        if: always()
        run: rm -f android/fastlane/service-account-key.json android/app/upload-keystore.jks
