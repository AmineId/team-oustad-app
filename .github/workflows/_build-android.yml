name: 🤖 Android Build (reusable)

on:
  workflow_call:
    inputs:
      dart-env:
        required: true
        type: string   # pprod | prod
      api-url:
        required: true
        type: string
      ref:
        required: false
        type: string
        default: ''
      deploy-to-play:
        required: false
        type: boolean
        default: false
      publish-version:
        required: false
        type: boolean
        default: false
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      SERVICE_ACCOUNT_JSON:
        required: false
      OTA_BEARER_TOKEN:
        required: false

  # Permet de lancer ce build Android seul, sans passer par Release & Deploy.
  # deploy-to-play / publish-version à false par défaut : un run manuel ne
  # garantit pas que version-metadata.json correspond à ce build.
  workflow_dispatch:
    inputs:
      dart-env:
        description: 'Environnement API / Firebase'
        required: true
        type: choice
        default: 'pprod'
        options: [pprod, prod]
      api-url:
        description: 'URL de l API backend'
        required: true
        type: string
        default: 'https://api-pprod.team-oustad.com'
      ref:
        description: 'Branche/ref à builder (vide = branche courante)'
        required: false
        type: string
        default: ''
      deploy-to-play:
        description: 'Déployer sur Play Store (internal testing)'
        required: false
        type: boolean
        default: false
      publish-version:
        description: 'Publier version-metadata.json sur le serveur'
        required: false
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.35.7'
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN || github.token }}

      - name: ☕ Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 🔧 Patch Flutter Gradle plugin (multi-module dedup)
        run: |
          # Flutter 3.35.x enregistre 'generateLockfiles' et l'extension 'flutter'
          # sur rootProject sans garde d'idempotence ; quand :app et :wear_app
          # appliquent tous deux le plugin, le 2e enregistrement échoue.
          #
          # subosito/flutter-action met en cache tout $FLUTTER_ROOT, y compris
          # packages/flutter_tools/gradle/build/ (classes compilées). On purge ce
          # répertoire pour forcer Gradle à recompiler depuis les sources patchées.
          GRADLE_CACHE="$FLUTTER_ROOT/packages/flutter_tools/gradle/build"
          if [ -d "$GRADLE_CACHE" ]; then
            rm -rf "$GRADLE_CACHE"
            echo "✅ Cache Gradle plugin Flutter purgé ($GRADLE_CACHE)"
          fi

          GRADLE_SRC="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin"
          PLUGIN_FILE="$GRADLE_SRC/FlutterPlugin.kt"
          HANDLER_FILE="$GRADLE_SRC/plugins/PluginHandler.kt"

          echo "--- lignes clés de FlutterPlugin.kt (debug) ---"
          grep -n "extensions\.create\|tasks\.register.*generateLock" "$PLUGIN_FILE" 2>/dev/null || echo "(fichier introuvable)"
          echo "--- lignes clés de PluginHandler.kt (debug) ---"
          grep -n "extensions\.create" "$HANDLER_FILE" 2>/dev/null || echo "(fichier introuvable)"
          echo "------------------------------------------------"

          python3 - "$PLUGIN_FILE" "$HANDLER_FILE" <<'PYEOF'
          import sys, pathlib

          def patch_file(path, patches):
              if not path.exists():
                  print(f"⚠️  {path.name} non trouvé, patch ignoré")
                  return
              content = path.read_text()
              changes = []
              for old, new in patches:
                  if old in content:
                      content = content.replace(old, new)
                      changes.append(old[:60])
              if changes:
                  path.write_text(content)
                  for c in changes:
                      print(f"✅ {path.name} — Patché : {c}…")
              else:
                  print(f"ℹ️  {path.name} — Aucun patch nécessaire (déjà corrigé ou pattern non trouvé)")

          # FlutterPlugin.kt
          patch_file(pathlib.Path(sys.argv[1]), [
              # generateLockfiles sur rootProject (toutes versions)
              (
                  'rootProject.tasks.register("generateLockfiles") {',
                  'if (rootProject.tasks.findByName("generateLockfiles") == null) rootProject.tasks.register("generateLockfiles") {',
              ),
              # extension flutter sur rootProject (Flutter ≤ 3.36)
              (
                  'rootProject.extensions.create("flutter", FlutterExtension::class.java)',
                  '(rootProject.extensions.findByName("flutter") as? FlutterExtension) ?: rootProject.extensions.create("flutter", FlutterExtension::class.java)',
              ),
              # extension flutter sur project (Flutter ≥ 3.37 et 3.35.x inside allprojects)
              (
                  'project.extensions.create("flutter", FlutterExtension::class.java)',
                  '(project.extensions.findByName("flutter") as? FlutterExtension) ?: project.extensions.create("flutter", FlutterExtension::class.java)',
              ),
          ])

          # PluginHandler.kt — configurePluginProject crée aussi l'extension flutter
          # sur chaque projet de plugin ET enregistre des afterEvaluate. Avec
          # :app + :wear_app, chaque plugin est configuré deux fois :
          #   1. extensions.create échoue au 2e passage (patchée ci-dessus)
          #   2. pluginProject.afterEvaluate échoue si le plugin est déjà évalué
          patch_file(pathlib.Path(sys.argv[2]), [
              # idempotence de l'extension flutter
              (
                  'pluginProject.extensions.create("flutter", FlutterExtension::class.java)',
                  '(pluginProject.extensions.findByName("flutter") as? FlutterExtension) ?: pluginProject.extensions.create("flutter", FlutterExtension::class.java)',
              ),
              # guard afterEvaluate sur pluginProject (déjà évalué au 2e passage)
              (
                  'pluginProject.afterEvaluate {',
                  'if (!pluginProject.state.executed) pluginProject.afterEvaluate {',
              ),
          ])
          PYEOF

      - name: 🔧 Configure Firebase
        run: |
          if [ "${{ inputs.dart-env }}" = "prod" ]; then
            cp android/app/google-services-prod.json android/app/google-services.json
          else
            cp android/app/google-services-pprod.json android/app/google-services.json
          fi

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔐 Setup Android signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
            echo "✅ Signing configuré"
          else
            echo "⚠️  Pas de keystore, debug signing"
          fi

      - name: 🏗️ Build AAB (téléphone + Wear OS intégré)
        run: |
          flutter build appbundle --release \
            --dart-define=ENVIRONMENT=${{ inputs.dart-env }} \
            --dart-define=API_BASE_URL=${{ inputs.api-url }}

      - name: 🔧 Setup Ruby + Fastlane
        if: inputs.deploy-to-play
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: 📦 Install Fastlane
        if: inputs.deploy-to-play
        run: cd android && bundle install

      - name: 🔐 Setup Play Store credentials
        if: inputs.deploy-to-play
        run: |
          mkdir -p android/fastlane
          cat > android/fastlane/service-account-key.json << 'EOFJSON'
          ${{ secrets.SERVICE_ACCOUNT_JSON }}
          EOFJSON
          jq empty android/fastlane/service-account-key.json || exit 1

      - name: 📝 Generate release notes
        if: inputs.deploy-to-play
        run: |
          mkdir -p android/fastlane/metadata/android/fr-FR/changelogs
          cat > android/fastlane/metadata/android/fr-FR/changelogs/default.txt << 'EOF'
          Nouveautés :
          • Borne d'accueil kiosk (scan QR)
          • Interface modernisée

          Corrections : résolution de bugs et optimisations
          EOF

      - name: 📤 Deploy to Play Store (internal testing)
        if: inputs.deploy-to-play
        env:
          FASTLANE_SKIP_UPDATE_CHECK: 'true'
        run: |
          AAB="$(pwd)/build/app/outputs/bundle/release/app-release.aab"
          [ -f "$AAB" ] || { echo "❌ AAB introuvable"; exit 1; }
          cd android && bundle exec fastlane supply \
            --aab "$AAB" \
            --track internal \
            --release_status completed \
            --json_key fastlane/service-account-key.json \
            --package_name team.oustad.app \
            --skip_upload_metadata \
            --skip_upload_images \
            --skip_upload_screenshots

      - name: 📤 Publish version to server
        if: inputs.publish-version
        run: |
          JSON_PAYLOAD=$(jq -n \
            --slurpfile meta version-metadata.json \
            --arg url "https://play.google.com/store/apps/details?id=team.oustad.app" \
            '$meta[0] | {version_code, version_name, changelog, force_update,
              min_supported_version, download_url: $url, channel: "production"}')
          echo "$JSON_PAYLOAD" | jq '.'
          RESPONSE=$(curl -s -w "\n%{http_code}" --connect-timeout 10 --max-time 30 \
            -X POST "${{ inputs.api-url }}/android/update-version" \
            -H "Authorization: Bearer ${{ secrets.OTA_BEARER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Publication échouée: HTTP $HTTP_CODE"; exit 1
          fi
          echo "✅ Version publiée"

      - name: 🧹 Cleanup
        if: always()
        run: rm -f android/fastlane/service-account-key.json android/app/upload-keystore.jks
