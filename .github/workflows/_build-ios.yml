name: 🍎 iOS Build (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string   # pprod | prod | dev
      api-url:
        required: false
        type: string
        default: ''
      ref:
        required: false
        type: string
        default: ''
      ipa-filename:
        required: false
        type: string
        default: 'TeamOustad.ipa'
    outputs:
      artifact-name:
        description: "Nom de l'artifact IPA uploade"
        value: ${{ jobs.build.outputs.artifact-name }}

  # Permet de lancer ce build iOS seul, sans passer par Release & Deploy
  workflow_dispatch:
    inputs:
      environment:
        description: 'API / Firebase environment'
        required: true
        type: choice
        default: 'pprod'
        options: [pprod, prod, dev]
      api-url:
        description: 'Override API_BASE_URL (optionnel)'
        required: false
        type: string
        default: ''
      ref:
        description: 'Branche/ref à builder (vide = branche courante)'
        required: false
        type: string
        default: ''
      ipa-filename:
        description: 'Nom du fichier .ipa produit'
        required: false
        type: string
        default: 'TeamOustad.ipa'

env:
  FLUTTER_VERSION: '3.35.7'

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact-name }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔥 Inject GoogleService-Info.plist
        env:
          PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$PLIST_B64" ]; then
            echo "$PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
            echo "✅ GoogleService-Info.plist injecté depuis le secret"
          elif [ -f ios/Runner/GoogleService-Info.plist ]; then
            echo "ℹ️  Secret GOOGLE_SERVICE_INFO_PLIST non défini — plist versionné utilisé"
          else
            echo "::error::Ni secret GOOGLE_SERVICE_INFO_PLIST ni ios/Runner/GoogleService-Info.plist"
            exit 1
          fi

      - name: 💎 Install xcodeproj gem
        run: gem install xcodeproj --no-document

      - name: ⌚ Ajouter le target watchOS au .xcodeproj
        id: watch_target
        run: ruby scripts/add-watch-target.rb

      - name: 🏗️ Build iOS (no codesign)
        id: build_ios
        run: |
          DEFINES="--dart-define=ENVIRONMENT=${{ inputs.environment }}"
          if [ -n "${{ inputs.api-url }}" ]; then
            DEFINES="$DEFINES --dart-define=API_BASE_URL=${{ inputs.api-url }}"
          fi
          set -o pipefail
          flutter build ios --release --no-codesign $DEFINES 2>&1 | tee build-ios.log
          # Sans détection, flutter passe -sdk iphoneos et la montre est compilée pour iOS
          if ! grep -q "Watch companion app found" build-ios.log; then
            echo "::error::flutter n'a pas détecté l'app montre (scheme TeamOustadWatch manquant ?)"
            exit 1
          fi

      - name: 📦 Package IPA
        id: meta
        run: |
          ARTIFACT_NAME="ios-ipa-${{ inputs.environment }}"
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry "${{ inputs.ipa-filename }}" Payload
          ls -lh "${{ inputs.ipa-filename }}"
          echo "artifact-name=${ARTIFACT_NAME}" >> $GITHUB_OUTPUT

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.artifact-name }}
          path: build/ipa/${{ inputs.ipa-filename }}
          retention-days: 14

      - name: 📋 Résumé
        if: always()
        continue-on-error: true
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          IPA: build/ipa/${{ inputs.ipa-filename }}
          ARTIFACT: ${{ steps.meta.outputs.artifact-name }}
          WATCH: ${{ steps.watch_target.outcome }}
          BUILD: ${{ steps.build_ios.outcome }}
        run: |
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "⏹️";; *) echo "⏭️";; esac; }
          APP=build/ios/iphoneos/Runner.app
          plist() { /usr/libexec/PlistBuddy -c "Print :$2" "$1" 2>/dev/null || echo "—"; }
          WATCH_APP=$(find "$APP/Watch" -maxdepth 1 -name "*.app" 2>/dev/null | head -1)
          {
            echo "### 🍎 iOS — \`$(plist "$APP/Info.plist" CFBundleShortVersionString)\` ($ENVIRONMENT)"
            echo
            echo "| Élément | Résultat | Détail |"
            echo "| --- | --- | --- |"
            echo "| Target watchOS | $(icon "$WATCH") | |"
            echo "| Build (non signé) | $(icon "$BUILD") | bundle \`$(plist "$APP/Info.plist" CFBundleIdentifier)\` |"
            echo "| App Apple Watch | $([ -n "$WATCH_APP" ] && echo ✅ || echo ❌) | $([ -n "$WATCH_APP" ] && plist "$WATCH_APP/Info.plist" CFBundleIdentifier || echo 'absente de l IPA') |"
            echo "| IPA | $([ -f "$IPA" ] && echo ✅ || echo —) | $([ -f "$IPA" ] && du -h "$IPA" | cut -f1) — artefact \`$ARTIFACT\` |"
            echo
            [ -f "$IPA" ] && echo "Installer sur l'iPhone (WSL) : \`scripts/ios-install.sh --download $ENVIRONMENT\`"
          } >> "$GITHUB_STEP_SUMMARY"
