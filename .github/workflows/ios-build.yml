name: 🍎 iOS Build (unsigned, for xtool)
run-name: iOS build (${{ inputs.environment }})

# Builds an unsigned iOS .ipa on a macOS runner. Flutter cannot build iOS on
# Linux/Windows, so this artifact is downloaded and signed + installed locally
# with xtool (see docs/ios/IOS_XTOOL.md).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'API / Firebase environment'
        required: true
        default: 'pprod'
        type: choice
        options:
          - pprod
          - prod
          - dev

env:
  FLUTTER_VERSION: '3.35.7'

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🏗️ Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=ENVIRONMENT=${{ inputs.environment }}

      - name: 📦 Package .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry "TeamFitness-${{ inputs.environment }}.ipa" Payload
          ls -lh *.ipa

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ inputs.environment }}
          path: build/ipa/TeamFitness-${{ inputs.environment }}.ipa
          retention-days: 14
