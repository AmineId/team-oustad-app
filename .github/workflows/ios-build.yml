name: 🍎 iOS Build (unsigned, for xtool)
run-name: iOS build (${{ inputs.environment }})

# Builds an unsigned iOS .ipa on a macOS runner. Flutter cannot build iOS on
# Linux/Windows, so this artifact is downloaded and signed + installed locally
# with xtool (see docs/ios/IOS_XTOOL.md).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'API / Firebase environment'
        required: true
        default: 'pprod'
        type: choice
        options:
          - pprod
          - prod
          - dev

jobs:
  build:
    uses: ./.github/workflows/_build-ios.yml
    with:
      environment: ${{ inputs.environment }}
      ipa-filename: TeamOustad-${{ inputs.environment }}.ipa
