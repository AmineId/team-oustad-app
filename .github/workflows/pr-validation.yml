name: ✅ PR Validation

on:
  pull_request:
    branches:
      - main
      - staging

env:
  FLUTTER_VERSION: '3.35.7'
  JAVA_VERSION: '17'

jobs:
  validate:
    name: 🔍 Validate Package
    runs-on: ubuntu-24.04
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: ☕ Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      # Même patch que la release : sans lui, :app + :wear_app font échouer le build
      - name: 🔧 Patch Flutter Gradle plugin (multi-module dedup)
        run: scripts/ci/patch-flutter-gradle.sh

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔍 Analyze code
        id: analyze
        run: flutter analyze --fatal-infos 2>&1 | tee analyze.log; exit ${PIPESTATUS[0]}

      - name: ✅ Run tests
        id: tests
        if: always() && steps.analyze.outcome != 'skipped'
        run: flutter test --reporter expanded 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

      - name: 🏗️ Test build (Android)
        id: build
        run: flutter build apk --debug --dart-define=ENVIRONMENT=pprod

      - name: 📋 Résumé
        if: always()
        continue-on-error: true
        env:
          ANALYZE: ${{ steps.analyze.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "⏹️";; *) echo "⏭️";; esac; }
          ISSUES=$(grep -E '^\s*(info|warning|error) •' analyze.log 2>/dev/null | wc -l)
          TEST_LINE=$(grep -E '^[0-9:]+ \+[0-9]+' test.log 2>/dev/null | tail -1 | sed -E 's/^([0-9:]+ [^:]*).*/\1/')
          {
            echo "### ✅ PR Validation"
            echo
            echo "| Étape | Résultat | Détail |"
            echo "| --- | --- | --- |"
            echo "| Analyse (--fatal-infos) | $(icon "$ANALYZE") | $ISSUES problème(s) |"
            echo "| Tests | $(icon "$TESTS") | ${TEST_LINE:-—} |"
            echo "| Build APK debug | $(icon "$BUILD") | $(du -h build/app/outputs/flutter-apk/app-debug.apk 2>/dev/null | cut -f1) |"
            if [ "$ISSUES" -gt 0 ]; then
              echo
              echo "<details><summary>Problèmes d'analyse</summary>"
              echo
              echo '```'
              grep -E '^\s*(info|warning|error) •' analyze.log | head -50
              echo '```'
              echo "</details>"
            fi
            if [ "$TESTS" = "failure" ]; then
              echo
              echo "<details><summary>Tests en échec</summary>"
              echo
              echo '```'
              grep -E '\[E\]|^\s+Expected|^\s+Actual' test.log | head -40
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
