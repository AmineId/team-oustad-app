name: 🚀 Release & Deploy

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.35.7'
  JAVA_VERSION: '17'

jobs:
  # Étape 1: Semantic-release met à jour les versions
  version:
    name: 📝 Version & Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      released: ${{ steps.check.outputs.released }}
      version: ${{ steps.check.outputs.version }}
      environment: ${{ steps.setup.outputs.environment }}
      dart_env: ${{ steps.setup.outputs.dart_env }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🔍 Setup environment
        id: setup
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "dart_env=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=beta" >> $GITHUB_OUTPUT
            echo "dart_env=pprod" >> $GITHUB_OUTPUT
          fi

      - name: 📦 Install semantic-release
        run: |
          npm install -g semantic-release@^22 @semantic-release/changelog@^6 \
            @semantic-release/git@^10 @semantic-release/exec@^6 \
            @semantic-release/github@^9 conventional-changelog-conventionalcommits@^7

      - name: 🧹 Clean old builds
        run: |
          echo "📁 Files in build/ before cleanup:"
          ls -lah build/ 2>/dev/null || echo "No build directory"
          rm -rf build/
          echo "✅ Build directory cleaned"

      - name: 🚀 Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Check release
        id: check
        run: |
          # Récupère la dernière version depuis le tag Git
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -n "$VERSION" ]; then
            echo "released=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "✅ New version: $VERSION"
          else
            echo "released=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No release"
          fi

  # Étape 2: Build avec les versions mises à jour
  build:
    name: 🏗️ Build APK
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout updated code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🔄 Fetch and checkout release commit
        run: |
          echo "🔍 Current commit: $(git rev-parse HEAD)"
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}
          echo "✅ Updated to commit: $(git rev-parse HEAD)"
          echo "📋 Latest commits:"
          git log --oneline -3
      
      - name: 🔍 Verify version files
        run: |
          echo "📋 Content of version-metadata.json:"
          cat version-metadata.json | jq '.'
          echo ""
          echo "📋 Version in pubspec.yaml:"
          grep "^version:" pubspec.yaml

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 🔧 Configure Firebase
        run: |
          if [[ "${{ needs.version.outputs.environment }}" == "production" ]]; then
            cp android/app/google-services-prod.json android/app/google-services.json
          else
            cp android/app/google-services-pprod.json android/app/google-services.json
          fi

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔐 Setup Android signing
        run: |
          # Décoder le keystore depuis base64 si disponible
          if [[ -n "${{ secrets.KEYSTORE_BASE64 }}" ]]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
            
            # Créer le fichier key.properties
            cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
            
            echo "✅ Android signing configured with production keystore"
          else
            echo "⚠️ No keystore configured, using debug signing"
          fi

      - name: 🏗️ Build APK
        run: flutter build apk --release --dart-define=ENVIRONMENT=${{ needs.version.outputs.dart_env }}

      - name: 🏗️ Build AAB (for Play Store)
        run: flutter build appbundle --release --dart-define=ENVIRONMENT=${{ needs.version.outputs.dart_env }}

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.version.outputs.environment }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
            version-metadata.json
          retention-days: 30
          if-no-files-found: error

  # Étape 3: Déploiement Play Store
  deploy-playstore:
    name: 📱 Deploy to Play Store Internal Testing
    needs: [version, build]
    runs-on: ubuntu-latest
    if: needs.version.outputs.released == 'true'
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.version.outputs.environment }}
          path: .

      - name: 🔍 List downloaded files
        run: |
          echo "📂 Structure des fichiers téléchargés:"
          ls -lahR . | head -n 100
          echo ""
          echo "🔎 Recherche de fichiers AAB:"
          find . -name "*.aab" -type f

      - name: 🔧 Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: false

      - name: 📦 Install Fastlane
        run: |
          gem install fastlane -v 2.217.0

      - name: 🔐 Setup Play Store credentials
        run: |
          mkdir -p android/fastlane
          # Écrire le JSON en utilisant cat et un heredoc pour éviter les problèmes d'échappement
          cat > android/fastlane/service-account-key.json << 'EOFJSON'
          ${{ secrets.SERVICE_ACCOUNT_JSON }}
          EOFJSON
          
          # Vérifier que le JSON est valide
          if jq empty android/fastlane/service-account-key.json 2>/dev/null; then
            echo "✅ Service account JSON is valid"
          else
            echo "❌ Service account JSON is invalid"
            cat android/fastlane/service-account-key.json | head -n 5
            exit 1
          fi

      - name: 📝 Generate release notes
        id: release_notes
        run: |
          # Générer les notes de version pour Play Store (max 500 caractères)
          NOTES="Nouveautés :
          • Mode clair/sombre avec basculement automatique
          • Interface moderne avec nouveaux composants UI
          • Notifications d'entraînement personnalisables
          
          Corrections :
          • Résolution de bugs d'interface
          • Optimisations de performance
          
          À tester :
          ✅ Le basculement entre mode clair/sombre
          ✅ La navigation générale
          ✅ Les notifications d'entraînement
          
          Merci de vos retours ! 💪"
          
          # Sauvegarder dans un fichier
          echo "$NOTES" > release-notes-fr.txt
          echo "✅ Notes de version générées"

      - name: 📤 Deploy to Internal Testing
        run: |
          # Trouver le fichier AAB
          AAB_PATH=$(find . -name "app-release.aab" -type f | head -n1)
          
          if [ -z "$AAB_PATH" ]; then
            echo "❌ AAB file not found!"
            exit 1
          fi
          
          echo "✅ AAB found at: $AAB_PATH"
          
          # Vérifier que le service account existe
          if [ ! -f "android/fastlane/service-account-key.json" ]; then
            echo "❌ Service account JSON not found!"
            exit 1
          fi
          
          echo "✅ Service account found"
          
          # Créer le dossier pour les notes de version
          mkdir -p fastlane/metadata/android/fr-FR/changelogs
          cp release-notes-fr.txt fastlane/metadata/android/fr-FR/changelogs/default.txt
          
          # Déployer avec Fastlane (utiliser le chemin absolu)
          fastlane supply \
            --aab "$AAB_PATH" \
            --track internal \
            --release_status draft \
            --json_key "$(pwd)/android/fastlane/service-account-key.json" \
            --package_name team.fitness.team_fitness_app \
            --skip_upload_metadata \
            --skip_upload_images \
            --skip_upload_screenshots

      - name: 📤 Update version.json on server
        if: success()
        run: |
          echo "📊 Mise à jour du serveur avec les informations de version"
          
          # Récupérer les métadonnées de version
          VERSION_CODE=$(jq -r '.version_code' version-metadata.json)
          VERSION_NAME=$(jq -r '.version_name' version-metadata.json)
          CHANGELOG=$(jq -r '.changelog' version-metadata.json)
          
          # URL du Play Store (toujours la même pour votre app)
          PLAY_STORE_URL="https://play.google.com/store/apps/details?id=team.fitness.team_fitness_app"
          
          # Créer le JSON pour l'API
          JSON_PAYLOAD=$(cat <<EOF
          {
            "version_code": $VERSION_CODE,
            "version_name": "$VERSION_NAME",
            "download_url": "$PLAY_STORE_URL",
            "changelog": "$CHANGELOG",
            "force_update": false,
            "channel": "${{ needs.version.outputs.environment }}"
          }
          EOF
          )
          
          # Envoyer au serveur
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://app.team-oustad.com/android/update-version" \
            -H "Authorization: Bearer ${{ secrets.OTA_BEARER_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Serveur mis à jour avec succès"
          else
            echo "⚠️ Erreur lors de la mise à jour du serveur: HTTP $HTTP_CODE"
            echo "$RESPONSE" | head -n-1
          fi

      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -f android/fastlane/service-account-key.json

  # Étape 4: Déploiement OTA
  deploy-ota:
    name: 🚀 Deploy OTA
    needs: [version, build, deploy-playstore]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.version.outputs.environment }}
      url: https://app.team-oustad.com/android/version.json
    
    steps:
      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.version.outputs.environment }}

      - name: 📊 Read metadata
        id: meta
        run: |
          jq -r 'to_entries | map("\(.key)=\(.value)") | .[]' version-metadata.json >> $GITHUB_OUTPUT
          echo "channel=${{ needs.version.outputs.environment }}" >> $GITHUB_OUTPUT

      - name: 📤 Upload to OTA
        run: |
          echo "🔍 Listing downloaded artifact contents (recursive):"
          ls -lahR . | head -n 200 || true

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found at $APK_PATH"
            echo "Attempting fallback: searching for *.apk"
            FOUND=$(find . -maxdepth 5 -type f -name "*.apk" | head -n1 || true)
            if [ -n "$FOUND" ]; then
              echo "➡️ Using found APK: $FOUND"
              APK_PATH="$FOUND"
            else
              echo "❌ No APK file found. Aborting deploy."
              exit 1
            fi
          else
            echo "✅ APK located at $APK_PATH"
          fi

          echo "📦 Uploading APK: $APK_PATH"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://app.team-oustad.com/android/upload" \
            -H "Authorization: Bearer ${{ secrets.OTA_BEARER_TOKEN }}" \
            -H "Accept: application/json" \
            -F "apk=@${APK_PATH}" \
            -F "version_code=${{ steps.meta.outputs.version_code }}" \
            -F "version_name=${{ steps.meta.outputs.version_name }}" \
            -F "changelog=${{ steps.meta.outputs.changelog }}" \
            -F "force_update=${{ steps.meta.outputs.force_update }}" \
            -F "min_supported_version=${{ steps.meta.outputs.min_supported_version }}" \
            -F "channel=${{ steps.meta.outputs.channel }}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)

          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Deployed successfully"
            echo "$RESPONSE" | head -n-1 | jq '.'
          else
            echo "❌ Deploy failed: HTTP $HTTP_CODE"
            echo "Raw response body (excluding status code line):"
            echo "$RESPONSE" | head -n-1 || true
            exit 1
          fi
