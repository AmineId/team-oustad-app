name: 🚀 Release & Deploy

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.35.7'
  JAVA_VERSION: '17'

jobs:
  # Étape 1: Semantic-release met à jour les versions
  version:
    name: 📝 Version & Changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      released: ${{ steps.check.outputs.released }}
      version: ${{ steps.check.outputs.version }}
      environment: ${{ steps.setup.outputs.environment }}
      dart_env: ${{ steps.setup.outputs.dart_env }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🔍 Setup environment
        id: setup
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "dart_env=prod" >> $GITHUB_OUTPUT
          else
            echo "environment=beta" >> $GITHUB_OUTPUT
            echo "dart_env=pprod" >> $GITHUB_OUTPUT
          fi

      - name: 📦 Install semantic-release
        run: |
          npm install -g semantic-release@^22 @semantic-release/changelog@^6 \
            @semantic-release/git@^10 @semantic-release/exec@^6 \
            @semantic-release/github@^9 conventional-changelog-conventionalcommits@^7

      - name: 🧹 Clean old builds
        run: |
          echo "📁 Files in build/ before cleanup:"
          ls -lah build/ 2>/dev/null || echo "No build directory"
          rm -rf build/
          echo "✅ Build directory cleaned"

      - name: 🚀 Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Check release
        id: check
        run: |
          # Récupère la dernière version depuis le tag Git
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -n "$VERSION" ]; then
            echo "released=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "✅ New version: $VERSION"
          else
            echo "released=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No release"
          fi

  # Étape 2: Build avec les versions mises à jour
  build:
    name: 🏗️ Build APK
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout updated code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      
      - name: 🔄 Fetch and checkout latest changes from semantic-release
        run: |
          git fetch origin ${{ github.ref_name }}
          git checkout ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 🔧 Configure Firebase
        run: |
          if [[ "${{ needs.version.outputs.environment }}" == "production" ]]; then
            cp android/app/google-services-prod.json android/app/google-services.json
          else
            cp android/app/google-services-pprod.json android/app/google-services.json
          fi

      - name: 📦 Get dependencies
        run: flutter pub get

      - name: 🔍 Verify version before build
        run: |
          echo "📋 Version information before build:"
          echo "----------------------------------------"
          echo "pubspec.yaml version:"
          grep "^version:" pubspec.yaml
          echo ""
          echo "version-metadata.json:"
          cat version-metadata.json | jq '{version_name, version_code}'
          echo "----------------------------------------"

      - name: 🏗️ Build APK
        run: flutter build apk --release --dart-define=ENVIRONMENT=${{ needs.version.outputs.dart_env }}

      - name: 🔍 Extract and verify APK version
        run: |
          echo "📦 Extracting version from built APK..."
          
          # Install aapt if not available
          sudo apt-get update -qq
          sudo apt-get install -y aapt
          
          # Extract version info from APK
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          APK_VERSION_CODE=$(aapt dump badging "$APK_PATH" | grep "versionCode" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          APK_VERSION_NAME=$(aapt dump badging "$APK_PATH" | grep "versionName" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          
          echo "✅ APK Version Information:"
          echo "   Version Name: $APK_VERSION_NAME"
          echo "   Version Code: $APK_VERSION_CODE"
          echo ""
          
          # Read expected version from metadata
          EXPECTED_VERSION_NAME=$(jq -r '.version_name' version-metadata.json)
          EXPECTED_VERSION_CODE=$(jq -r '.version_code' version-metadata.json)
          
          echo "📋 Expected from version-metadata.json:"
          echo "   Version Name: $EXPECTED_VERSION_NAME"
          echo "   Version Code: $EXPECTED_VERSION_CODE"
          echo ""
          
          # Verify versions match
          if [ "$APK_VERSION_CODE" != "$EXPECTED_VERSION_CODE" ]; then
            echo "❌ ERROR: Version code mismatch!"
            echo "   APK has version code $APK_VERSION_CODE but metadata expects $EXPECTED_VERSION_CODE"
            exit 1
          fi
          
          if [ "$APK_VERSION_NAME" != "$EXPECTED_VERSION_NAME" ]; then
            echo "❌ ERROR: Version name mismatch!"
            echo "   APK has version name $APK_VERSION_NAME but metadata expects $EXPECTED_VERSION_NAME"
            exit 1
          fi
          
          echo "✅ Version verification passed! APK matches metadata."

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.version.outputs.environment }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            version-metadata.json
          retention-days: 30

  # Étape 3: Déploiement OTA
  deploy:
    name: 🚀 Deploy OTA
    needs: [version, build]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.version.outputs.environment }}
      url: https://app.team-oustad.com/android/version.json
    
    steps:
      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.version.outputs.environment }}

      - name: 📊 Read metadata
        id: meta
        run: |
          jq -r 'to_entries | map("\(.key)=\(.value)") | .[]' version-metadata.json >> $GITHUB_OUTPUT
          echo "channel=${{ needs.version.outputs.environment }}" >> $GITHUB_OUTPUT
      
      - name: 🔍 Verify APK version before upload
        run: |
          # Install aapt to read APK info
          sudo apt-get update -qq
          sudo apt-get install -y aapt
          
          APK_VERSION_CODE=$(aapt dump badging app-release.apk | grep "versionCode" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          APK_VERSION_NAME=$(aapt dump badging app-release.apk | grep "versionName" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          
          echo "📦 APK to be uploaded:"
          echo "   File: app-release.apk"
          echo "   Size: $(du -h app-release.apk | cut -f1)"
          echo "   Version Name: $APK_VERSION_NAME"
          echo "   Version Code: $APK_VERSION_CODE"
          echo ""
          echo "📋 Metadata to be uploaded:"
          cat version-metadata.json | jq '{version_name, version_code, changelog, force_update}'

      - name: 📤 Upload to OTA
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://app.team-oustad.com/android/upload" \
            -H "Authorization: Bearer ${{ secrets.OTA_BEARER_TOKEN }}" \
            -H "Accept: application/json" \
            -F "apk=@app-release.apk" \
            -F "version_code=${{ steps.meta.outputs.version_code }}" \
            -F "version_name=${{ steps.meta.outputs.version_name }}" \
            -F "changelog=${{ steps.meta.outputs.changelog }}" \
            -F "force_update=${{ steps.meta.outputs.force_update }}" \
            -F "min_supported_version=${{ steps.meta.outputs.min_supported_version }}" \
            -F "channel=${{ steps.meta.outputs.channel }}")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          
          if [ "$HTTP_CODE" -eq 200 ]; then
            echo "✅ Deployed successfully"
            echo "$RESPONSE" | head -n-1 | jq '.'
          else
            echo "❌ Deploy failed: $HTTP_CODE"
            exit 1
          fi
