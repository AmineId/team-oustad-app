name: 🚀 Release & Deploy

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.35.7'
  JAVA_VERSION: '17'

jobs:
  # Étape 1: Semantic-release met à jour les versions
  version:
    name: 📝 Version & Changelog
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write

    outputs:
      released: ${{ steps.check.outputs.released }}
      version: ${{ steps.check.outputs.version }}
      environment: ${{ steps.setup.outputs.environment }}
      dart_env: ${{ steps.setup.outputs.dart_env }}
      api_url: ${{ steps.setup.outputs.api_url }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: 🔍 Setup environment
        id: setup
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "dart_env=prod" >> $GITHUB_OUTPUT
            echo "api_url=https://api.team-oustad.com" >> $GITHUB_OUTPUT
          else
            echo "environment=beta" >> $GITHUB_OUTPUT
            echo "dart_env=pprod" >> $GITHUB_OUTPUT
            echo "api_url=https://api-pprod.team-oustad.com" >> $GITHUB_OUTPUT
          fi

      - name: 📦 Install semantic-release
        run: |
          npm install -g semantic-release@^22 @semantic-release/changelog@^6 \
            @semantic-release/git@^10 @semantic-release/exec@^6 \
            @semantic-release/github@^9 conventional-changelog-conventionalcommits@^7

      - name: 🧹 Clean old builds
        run: |
          echo "📁 Files in build/ before cleanup:"
          ls -lah build/ 2>/dev/null || echo "No build directory"
          rm -rf build/
          echo "✅ Build directory cleaned"

      - name: 🚀 Run semantic-release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Check release
        id: check
        run: |
          # Un tag qui existe déjà dans l'historique ne veut pas dire que CE run
          # vient d'en créer un (ex: commit ci:/chore: → pas de release). On ne
          # considère "released" que si le tag le plus récent pointe exactement
          # sur HEAD, c-à-d qu'il vient d'être créé par semantic-release/git ci-dessus.
          git fetch origin --tags --force
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -n "$VERSION" ] && [ "$(git rev-list -n 1 "$VERSION")" = "$(git rev-parse HEAD)" ]; then
            echo "released=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "✅ New version: $VERSION"
          else
            echo "released=false" >> $GITHUB_OUTPUT
            echo "ℹ️  No release"
          fi

      - name: 📋 Résumé
        if: always()
        continue-on-error: true
        env:
          RELEASED: ${{ steps.check.outputs.released }}
          VERSION: ${{ steps.check.outputs.version }}
          ENVIRONMENT: ${{ steps.setup.outputs.environment }}
          API_URL: ${{ steps.setup.outputs.api_url }}
        run: |
          {
            echo "### 📝 Version — \`${{ github.ref_name }}\` → $ENVIRONMENT"
            echo
            echo "- Commit : \`${GITHUB_SHA::7}\` — $(git log -1 --format=%s "$GITHUB_SHA" 2>/dev/null)"
            echo "- API : \`$API_URL\`"
            if [ "$RELEASED" = "true" ]; then
              echo "- Release : **$VERSION** → builds Android, iOS et web lancés"
              echo
              echo "<details><summary>Changelog $VERSION</summary>"
              echo
              # Première section de version du CHANGELOG (celle que semantic-release vient d'écrire)
              awk '/^## \[/{n++} n==1' CHANGELOG.md
              echo
              echo "</details>"
            else
              echo "- Release : aucune (pas de commit feat/fix/perf/refactor depuis le dernier tag) → rien n'est buildé"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Étape 2a: Build Android + Play Store (réutilise _build-android.yml)
  build-android:
    name: 🤖 Build & Deploy Android
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/_build-android.yml
    permissions:
      contents: read
    with:
      dart-env: ${{ needs.version.outputs.dart_env }}
      api-url: ${{ needs.version.outputs.api_url }}
      ref: ${{ github.ref }}
      deploy-to-play: true
      publish-version: true
    secrets: inherit

  # Étape 2b: Build iOS (en parallèle avec build-android, réutilise _build-ios.yml)
  build-ios:
    name: 🍎 Build iOS
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/_build-ios.yml
    with:
      environment: ${{ needs.version.outputs.dart_env }}
      api-url: ${{ needs.version.outputs.api_url }}
      ref: ${{ github.ref }}
      ipa-filename: TeamOustad-${{ needs.version.outputs.dart_env }}-${{ needs.version.outputs.version }}.ipa
    secrets: inherit

  # Étape 2c: Build Web kiosk (en parallèle avec build-android/build-ios, réutilise _build-web.yml)
  build-web-kiosk:
    name: 🌐 Build Kiosk Web
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/_build-web.yml
    with:
      dart-env: ${{ needs.version.outputs.dart_env }}
      web-target: kiosk
      api-url: ${{ needs.version.outputs.api_url }}
      ref: ${{ github.ref }}
      android-testing-url: ${{ vars.ANDROID_TESTING_URL }}
      ipa-url: https://kiosk.team-oustad.com/TeamOustad.ipa
      altstore-source-url: ${{ github.ref_name == 'main' && 'https://team-fitness-kiosk.pages.dev/altstore.json' || format('https://{0}.team-fitness-kiosk.pages.dev/altstore.json', github.ref_name) }}

  # Étape 2d: Build Web page vitrine salles (même build, home différent via WEB_TARGET)
  build-web-showcase:
    name: 🏋 Build Showcase Web
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/_build-web.yml
    with:
      dart-env: ${{ needs.version.outputs.dart_env }}
      web-target: showcase
      api-url: ${{ needs.version.outputs.api_url }}
      ref: ${{ github.ref }}

  # Étape 3a: Deploy kiosk — récupère l'IPA buildé par build-ios (pas de rebuild),
  # le place dans le build web buildé par build-web-kiosk, et pousse le tout sur Pages.
  deploy-kiosk:
    name: 🏋 Deploy Kiosk
    needs: [version, build-ios, build-web-kiosk]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Download web build
        uses: actions/download-artifact@v6
        with:
          name: ${{ needs.build-web-kiosk.outputs.artifact-name }}
          path: build/web

      - name: 📥 Download IPA
        uses: actions/download-artifact@v6
        with:
          name: ${{ needs.build-ios.outputs.artifact-name }}
          path: /tmp/ipa

      - name: 📦 Merge IPA dans le build web
        run: |
          IPA_FILE=$(ls /tmp/ipa/*.ipa | head -1)
          cp "$IPA_FILE" build/web/TeamOustad.ipa
          echo "✅ IPA inclus : $(du -sh build/web/TeamOustad.ipa)"

      # Source AltStore / SideStore : servie à côté de l'IPA sur Cloudflare Pages,
      # via l'alias de branche (*.team-fitness-kiosk.pages.dev) tant que le DNS
      # kiosk.team-oustad.com n'est pas prêt.
      - name: 📲 Générer la source AltStore
        env:
          BRANCH: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          DART_ENV: ${{ needs.version.outputs.dart_env }}
        run: |
          set -euo pipefail
          if [ "$BRANCH" = "main" ]; then
            BASE_URL="https://team-fitness-kiosk.pages.dev"
          else
            ALIAS=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
            BASE_URL="https://${ALIAS}.team-fitness-kiosk.pages.dev"
          fi
          python3 - "$BASE_URL" <<'PY'
          import json, os, plistlib, sys, zipfile, datetime
          base = sys.argv[1]
          ipa = "build/web/TeamOustad.ipa"
          with zipfile.ZipFile(ipa) as z:
              name = next(n for n in z.namelist()
                          if n.startswith("Payload/") and n.endswith(".app/Info.plist") and n.count("/") == 2)
              info = plistlib.loads(z.read(name))
          env = os.environ["DART_ENV"]
          source = {
              "name": f"Team Oustad ({env})",
              "identifier": f"com.teamoustad.source.{env}",
              "apps": [{
                  "name": "Team Oustad",
                  "bundleIdentifier": info["CFBundleIdentifier"],
                  "developerName": "Team Oustad",
                  "localizedDescription": "Builds de test privés.",
                  "iconURL": f"{base}/icons/Icon-512.png",
                  "versions": [{
                      "version": os.environ["VERSION"],
                      "date": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "size": os.path.getsize(ipa),
                      "downloadURL": f"{base}/TeamOustad.ipa",
                      "minOSVersion": info.get("MinimumOSVersion", "13.0"),
                  }],
              }],
              "news": [],
          }
          json.dump(source, open("build/web/altstore.json", "w"), indent=2)
          url = f"{base}/altstore.json"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### 📲 Source AltStore — {os.environ['VERSION']}\n\n"
                      f"- AltStore : `altstore://source?url={url}`\n"
                      f"- SideStore : `sidestore://source?url={url}`\n")
          print(url)
          PY

      - name: 🌐 Create CF Pages project (if not exists)
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"team-fitness-kiosk","production_branch":"main"}' \
            | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          if r.get('success'):
              print('✅ Projet créé:', r['result'].get('name'))
          elif any(e.get('code') == 8000007 for e in r.get('errors', [])):
              print('ℹ️  Projet déjà existant')
          else:
              print('⚠️ ', r.get('errors'))
          "

      - name: 🚀 Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy build/web
            --project-name=team-fitness-kiosk
            --branch=${{ github.ref_name }}
            --commit-dirty=true

      - name: 📋 Résumé
        if: always()
        continue-on-error: true
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          case "$OUTCOME" in success) ICON="✅";; failure) ICON="❌";; *) ICON="⏭️";; esac
          {
            echo "### 🌐 Déploiement Kiosk $ICON"
            echo
            echo "- Projet Cloudflare Pages : \`team-fitness-kiosk\` (branche \`${{ github.ref_name }}\`)"
            [ -n "$ALIAS_URL" ] && echo "- URL de branche : $ALIAS_URL"
            [ -n "$DEPLOYMENT_URL" ] && echo "- Ce déploiement : $DEPLOYMENT_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  # Étape 3b: Deploy showcase — page vitrine publique des salles (team-oustad.com).
  deploy-showcase:
    name: 🏋 Deploy Showcase
    needs: [version, build-web-showcase]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 Download web build
        uses: actions/download-artifact@v6
        with:
          name: ${{ needs.build-web-showcase.outputs.artifact-name }}
          path: build/web

      - name: 🌐 Create CF Pages project (if not exists)
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"name":"team-fitness-showcase","production_branch":"main"}' \
            | python3 -c "
          import sys, json
          r = json.load(sys.stdin)
          if r.get('success'):
              print('✅ Projet créé:', r['result'].get('name'))
          elif any(e.get('code') == 8000007 for e in r.get('errors', [])):
              print('ℹ️  Projet déjà existant')
          else:
              print('⚠️ ', r.get('errors'))
          "

      - name: 🚀 Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy build/web
            --project-name=team-fitness-showcase
            --branch=${{ github.ref_name }}
            --commit-dirty=true

      - name: 📋 Résumé
        if: always()
        continue-on-error: true
        env:
          OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          case "$OUTCOME" in success) ICON="✅";; failure) ICON="❌";; *) ICON="⏭️";; esac
          {
            echo "### 🌐 Déploiement Vitrine $ICON"
            echo
            echo "- Projet Cloudflare Pages : \`team-fitness-showcase\` (branche \`${{ github.ref_name }}\`)"
            [ -n "$ALIAS_URL" ] && echo "- URL de branche : $ALIAS_URL"
            [ -n "$DEPLOYMENT_URL" ] && echo "- Ce déploiement : $DEPLOYMENT_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  # Étape 4: récapitulatif de la release sur la page du run (un seul écran,
  # sans ouvrir chaque job).
  recap:
    name: 📋 Récap
    needs: [version, build-android, build-ios, build-web-kiosk, build-web-showcase, deploy-kiosk, deploy-showcase]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: 📋 Récap
        env:
          RELEASED: ${{ needs.version.outputs.released }}
          VERSION: ${{ needs.version.outputs.version }}
          ENVIRONMENT: ${{ needs.version.outputs.environment }}
          R_VERSION: ${{ needs.version.result }}
          R_ANDROID: ${{ needs.build-android.result }}
          R_IOS: ${{ needs.build-ios.result }}
          R_KIOSK_BUILD: ${{ needs.build-web-kiosk.result }}
          R_SHOWCASE_BUILD: ${{ needs.build-web-showcase.result }}
          R_KIOSK: ${{ needs.deploy-kiosk.result }}
          R_SHOWCASE: ${{ needs.deploy-showcase.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          icon() { case "$1" in success) echo "✅";; failure) echo "❌";; cancelled) echo "⏹️";; *) echo "⏭️";; esac; }
          {
            if [ "$RELEASED" = "true" ]; then
              echo "## 🚀 $VERSION → $ENVIRONMENT"
            else
              echo "## ℹ️ Pas de release (${{ github.ref_name }})"
            fi
            echo
            echo "| Job | Résultat | Livrable |"
            echo "| --- | --- | --- |"
            echo "| Version & Changelog | $(icon "$R_VERSION") | tag \`${VERSION:-—}\` |"
            echo "| Android | $(icon "$R_ANDROID") | Play Store, piste internal |"
            echo "| iOS | $(icon "$R_IOS") | artefact IPA → \`scripts/ios-install.sh --download\` |"
            echo "| Web kiosk | $(icon "$R_KIOSK_BUILD") build · $(icon "$R_KIOSK") déploiement | kiosk (Cloudflare Pages) |"
            echo "| Web vitrine | $(icon "$R_SHOWCASE_BUILD") build · $(icon "$R_SHOWCASE") déploiement | team-oustad.com (Cloudflare Pages) |"
            echo
            echo "Le détail (tailles, versions, URLs) est dans les résumés de chaque job, plus bas sur [cette page]($RUN_URL)."
          } >> "$GITHUB_STEP_SUMMARY"
